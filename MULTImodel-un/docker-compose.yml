version: "3.9"

services:
  core-ai:
    build:
      context: .
      dockerfile: Dockerfile

    container_name: core-ai

    ports:
      - "8000:8000"

    env_file:
      - .env

    volumes:
      - ./vector_db:/app/vector_db
      - ./data/uploads:/app/data/uploads

    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

    restart: unless-stopped